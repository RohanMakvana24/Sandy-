    <text x="0" y="-70" fill="#9ba074" font-family="monospace" font-size="11" text-anchor="middle" letter-spacing="3">RAJKOT · INDIA</text>
  </g>

  <!-- BARBER VERIFIED PROFILE BLOCK -->
