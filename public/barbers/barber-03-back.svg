    <text x="0" y="0" fill="#E8DDC8" font-family="'Outfit', sans-serif" font-size="34" font-weight="700" letter-spacing="0.5">DEVANG RATHOD</text>
    <text x="0" y="32" fill="#9ba074" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600" letter-spacing="2">BEARD ARCHITECT & COLORIST</text>
    <text x="0" y="60" fill="#E8DDC8" fill-opacity="0.5" font-family="monospace" font-size="13" letter-spacing="2">PASS ID: SMS-2026-03 · 9 YEARS CRAFT</text>
  </g>

