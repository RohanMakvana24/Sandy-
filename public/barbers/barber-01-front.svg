    <text x="0" y="56" fill="#E8DDC8" font-family="'Outfit', sans-serif" font-size="62" font-weight="800" letter-spacing="-1">SANDY V.</text>

    <!-- Professional Role Subtitle -->
    <text x="0" y="98" fill="#E8DDC8" fill-opacity="0.75" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="600" letter-spacing="2.5">FOUNDER & MASTER ART DIRECTOR</text>

    <!-- Horizontal Decorative Divider -->
    <line x1="0" y1="126" x2="872" y2="126" stroke="#77795B" stroke-width="1.5" stroke-opacity="0.45"/>
    <polygon points="436,122 440,126 436,130 432,126" fill="#9ba074"/>

    <!-- Specialties Preview Row -->
    <g transform="translate(0, 160)">
      <text x="0" y="0" fill="#9ba074" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="2.5">PRIMARY SPECIALTY</text>
      <text x="0" y="28" fill="#E8DDC8" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="500">Precision Scissor Architecture</text>
