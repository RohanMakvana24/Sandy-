<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="960" viewBox="0 0 800 960" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Studio Vignette Gradient -->
    <radialGradient id="studioVignette" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1f2123" />
      <stop offset="55%" stop-color="#171819" />
      <stop offset="100%" stop-color="#0f1011" />
    </radialGradient>

    <!-- Olive Ambient Highlight -->
    <radialGradient id="oliveRim" cx="72%" cy="28%" r="48%">
      <stop offset="0%" stop-color="rgba(119, 121, 91, 0.28)" />
      <stop offset="65%" stop-color="rgba(119, 121, 91, 0.04)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>

    <!-- Warm Key Highlight -->
    <radialGradient id="warmKey" cx="30%" cy="20%" r="52%">
      <stop offset="0%" stop-color="rgba(255, 244, 222, 0.14)" />
      <stop offset="55%" stop-color="rgba(255, 244, 222, 0.02)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>

    <!-- Subtle Hairline Grid Pattern -->
    <pattern id="precisionGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="60" y2="0" stroke="rgba(119, 121, 91, 0.06)" stroke-width="1" />
      <line x1="0" y1="0" x2="0" y2="60" stroke="rgba(119, 121, 91, 0.06)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Deep Glossy Black Background -->
  <rect width="100%" height="100%" fill="url(#studioVignette)" />

  <!-- Subtle Studio Grid -->
  <rect width="100%" height="100%" fill="url(#precisionGrid)" opacity="0.65" />

  <!-- Ambient Light Pools -->
  <rect width="100%" height="100%" fill="url(#oliveRim)" />
  <rect width="100%" height="100%" fill="url(#warmKey)" />

  <!-- Geometric Architectural Calibration Rings -->
  <g opacity="0.28">
    <circle cx="400" cy="460.79999999999995" r="288" fill="none" stroke="#989B74" stroke-width="1" stroke-dasharray="4 8" />
    <circle cx="400" cy="460.79999999999995" r="336" fill="none" stroke="#FFF4DE" stroke-width="0.75" />
    <line x1="372" y1="460.79999999999995" x2="428" y2="460.79999999999995" stroke="#989B74" stroke-width="1" />
    <line x1="400" y1="432.79999999999995" x2="400" y2="488.79999999999995" stroke="#989B74" stroke-width="1" />
  </g>

  <!-- Central Silhouette Composition -->
  
      <!-- Classic Taper Fade Silhouette -->
      <path d="M 240 710.4
               C 224.00000000000003 556.8, 272 384, 336 307.2
               C 416 230.39999999999998, 528 240, 608 336
               C 656 432, 640 576, 608 720
               L 544 883.2
               L 272 883.2 Z"
            fill="#121315" stroke="#989B74" stroke-width="2" stroke-opacity="0.4" />
      <!-- Clean contour taper lines -->
      <path d="M 304 403.2 C 384 326.40000000000003, 496 345.59999999999997, 576 422.4"
            fill="none" stroke="#FFF4DE" stroke-width="2" stroke-opacity="0.5" />
      <path d="M 288 499.20000000000005 C 368 441.6, 480 460.79999999999995, 560 537.6"
            fill="none" stroke="#989B74" stroke-width="2" stroke-opacity="0.65" />
    

  <!-- Top Editorial Identification Overlay -->
  <g transform="translate(36, 48)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="11" font-weight="600" fill="#989B74" letter-spacing="3.2">SANDY MEN'S SALON · RAJKOT</text>
    <text x="0" y="24" font-family="'Outfit', 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#F5F0E8" letter-spacing="2.6">FADE STYLES</text>
  </g>

  <!-- Bottom Architectural Frame Badge -->
  <g transform="translate(36, 912)">
    <rect x="-12" y="-32" width="752" height="42" fill="rgba(23, 24, 25, 0.72)" stroke="rgba(119, 121, 91, 0.32)" stroke-width="1" rx="2" />
    <text x="6" y="-12" font-family="'Outfit', 'Helvetica Neue', sans-serif" font-size="14" font-weight="700" fill="#FFF4DE" letter-spacing="1.5">02 — CLASSIC TAPER FADE</text>
    <text x="720" y="-12" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#989B74" letter-spacing="2">35MM · 8K</text>
  </g>

  <!-- Outer Architectural Hairline Border -->
  <rect x="12" y="12" width="776" height="936" fill="none" stroke="rgba(119, 121, 91, 0.28)" stroke-width="1" />
</svg>