      <!-- Center transformation dividing hairline -->
      <line x1="700" y1="165.6" x2="700" y2="772.8"
            stroke="#989B74" stroke-width="1.5" stroke-dasharray="6 8" stroke-opacity="0.7" />
    

  <!-- Top Editorial Identification Overlay -->
  <g transform="translate(36, 48)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="11" font-weight="600" fill="#989B74" letter-spacing="3.2">SANDY MEN'S SALON · RAJKOT</text>
    <text x="0" y="24" font-family="'Outfit', 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#F5F0E8" letter-spacing="2.6">TRANSFORMATIONS</text>
  </g>

  <!-- Bottom Architectural Frame Badge -->
  <g transform="translate(36, 872)">
    <rect x="-12" y="-32" width="1352" height="42" fill="rgba(23, 24, 25, 0.72)" stroke="rgba(119, 121, 91, 0.32)" stroke-width="1" rx="2" />
    <text x="6" y="-12" font-family="'Outfit', 'Helvetica Neue', sans-serif" font-size="14" font-weight="700" fill="#FFF4DE" letter-spacing="1.5">06 — SIGNATURE TRANSFORMATION</text>
    <text x="1320" y="-12" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#989B74" letter-spacing="2">35MM · 8K</text>
